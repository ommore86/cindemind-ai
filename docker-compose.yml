version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cinemind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinemind
      POSTGRES_PASSWORD: cinemind_secret
      POSTGRES_DB: cinemind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinemind -d cinemind_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinemind_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://cinemind:cinemind_secret@postgres:5432/cinemind_db
      - PORT=8000
      - HOST=0.0.0.0
      - USE_PYSPARK=true
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinemind_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
