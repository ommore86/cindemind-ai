# CineMind AI — Render Blueprint Deployment Specification
# Automatically provisions both the FastAPI Backend Web Service and Vite React Frontend Static Site

services:
  # ==========================================
  # 1. FastAPI Backend Web Service
  # ==========================================
  - type: web
    name: cinemind-backend
    runtime: python
    plan: free
    region: oregon # or ohio, frankfurt, singapore
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DATABASE_URL
        value: sqlite:///./cinemind.db
      - key: FRONTEND_URL
        fromStaticSite:
          name: cinemind-frontend
          property: url

  # ==========================================
  # 2. React + Vite Frontend Static Site
  # ==========================================
  - type: static
    name: cinemind-frontend
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cinemind-backend
          property: url
